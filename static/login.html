<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录｜智能排班系统</title>
  <link rel="stylesheet" href="/fonts/lxgw-wenkai-screen/1.522.0/lxgw-wenkai-screen.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="tape" aria-hidden="true"></div>
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </div>
      <p class="eyebrow">SMART SCHEDULING</p>
      <h1 id="login-title">智能排班系统</h1>
      <p class="intro">请先登录，再进入排班工作台。</p>

      <form id="login-form">
        <label for="username">账号</label>
        <input id="username" name="username" type="text" autocomplete="username" maxlength="80" required autofocus>

        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>

        <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
        <button id="login-submit" type="submit">登录并进入</button>
      </form>
      <p class="security-note">登录状态仅保存在当前浏览器，12 小时后自动失效。</p>
    </section>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
